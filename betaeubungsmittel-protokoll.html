<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Betäubungsmittelprotokoll</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 14px;
      margin: 2rem 2.5rem;
      color: #111;
      background: #fff;
    }

    /* ── Kopfbereich ── */
    .titel { font-weight: bold; margin-bottom: 0.1rem; }
    .untertitel { margin: 0 0 0.2rem 0; font-size: 13px; }
    .quelle { margin: 0 0 1.5rem 0; font-size: 13px; }

    /* ── Erfassungsbereich (Formular-Zeile) ── */
    .erfassung {
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      border-top: 1px solid #ccc;
      padding-top: 1rem;
    }
    .erfassung .feld { display: flex; flex-direction: column; font-size: 12px; }
    .erfassung .feld label { font-weight: bold; margin-bottom: 2px; }
    .erfassung .feld input,
    .erfassung .feld select {
      padding: 3px 5px;
      border: 1px solid #999;
      font-size: 13px;
      min-width: 110px;
    }
    .erfassung .feld.schmal input { min-width: 60px; }
    .btn-gruppe { display: flex; gap: 0.4rem; align-items: flex-end; }
    .btn {
      padding: 4px 12px;
      border: 1px solid #555;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    .btn:hover { background: #f0f0f0; }
    .fehler {
      color: red;
      font-size: 12px;
      margin-top: 0.3rem;
      width: 100%;
    }

    /* ── Protokolltabelle (Spitex-Stil) ── */
    table {
      border-collapse: collapse;
      width: 100%;
    }
    thead tr {
      border-bottom: 1px solid #555;
    }
    th {
      font-weight: bold;
      font-size: 13px;
      padding: 4px 10px 4px 0;
      text-align: left;
      white-space: nowrap;
    }
    td {
      padding: 5px 10px 5px 0;
      font-size: 13px;
      border-bottom: 1px solid #ddd;
      vertical-align: middle;
    }
    td.med-name {
      text-decoration: underline;
    }
    td.zahl {
      text-align: center;
    }
    th.zahl {
      text-align: center;
    }
    tr:last-child td { border-bottom: none; }

    /* ── leer-Platzhalter ── */
    .leer { color: #aaa; font-style: italic; font-size: 12px; }
  </style>
</head>
<body>

<p class="titel">Betäubungsmittelprotokoll:</p>
<p class="untertitel">Abgelegt in den Vitaldaten</p>
<p class="quelle">Bsp. Formular von Spitex Zürisee:</p>

<!-- ================================================================
     ERFASSUNGSZEILE
     ================================================================ -->
<div class="erfassung">

  <div class="feld">
    <label for="fMedikament">Medikament</label>
    <select id="fMedikament">
      <option value="">-- wählen --</option>
    </select>
  </div>

  <div class="feld schmal">
    <label for="fMenge">Menge</label>
    <input type="number" id="fMenge" min="1" step="1" placeholder="z. B. 2" />
  </div>

  <div class="feld">
    <label for="fErfasser">Erfasser</label>
    <input type="text" id="fErfasser" placeholder="z. B. m.muster" style="min-width:100px;" />
  </div>

  <div class="btn-gruppe">
    <button class="btn" id="btnZugang" onclick="buchen('Zugang')">+ Zugang</button>
    <button class="btn" id="btnEntnahme" onclick="buchen('Entnahme')">− Entnahme</button>
  </div>

  <div class="fehler" id="fehlerMsg"></div>
</div>

<!-- ================================================================
     PROTOKOLLTABELLE
     ================================================================ -->
<table id="protokollTabelle">
  <thead>
    <tr>
      <th>Erhoben am:</th>
      <th>Medikament:</th>
      <th class="zahl">Eingang:</th>
      <th class="zahl">Anzahl vor der Entnahme:</th>
      <th class="zahl">Entnahme:</th>
      <th class="zahl">Anzahl nach der Entnahme:</th>
      <th>Erfasser:</th>
    </tr>
  </thead>
  <tbody id="protokollBody">
    <tr id="leerZeile">
      <td colspan="7" class="leer">Noch keine Einträge vorhanden.</td>
    </tr>
  </tbody>
</table>

<script>
  // ================================================================
  // Stammdaten
  // ================================================================
  const MEDIKAMENTE = [
    "Fentanyl 0,05 mg/ml Inj.",
    "Morphin 10 mg/ml Inj.",
    "Oxycodon 10 mg Kps.",
    "Midazolam 5 mg/ml Inj.",
    "Ketamin 50 mg/ml Inj.",
    "Tramadol 100 mg Inj.",
  ];

  // Bestand je Medikament
  const bestand = {};
  MEDIKAMENTE.forEach(m => bestand[m] = 0);

  // Dropdown befüllen
  const sel = document.getElementById("fMedikament");
  MEDIKAMENTE.forEach(m => {
    const o = document.createElement("option");
    o.value = o.textContent = m;
    sel.appendChild(o);
  });

  // ================================================================
  // Datum-Hilfsfunktion
  // ================================================================
  function datumHeute() {
    const d = new Date();
    return `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}`;
  }

  // ================================================================
  // Buchung ausführen
  // ================================================================
  function buchen(typ) {
    const fehlerDiv = document.getElementById("fehlerMsg");
    fehlerDiv.textContent = "";

    const med      = document.getElementById("fMedikament").value;
    const mengeRaw = document.getElementById("fMenge").value;
    const erfasser = document.getElementById("fErfasser").value.trim();
    const menge    = parseInt(mengeRaw, 10);

    // Validierung
    if (!med) { fehlerDiv.textContent = "Bitte ein Medikament wählen."; return; }
    if (!mengeRaw || isNaN(menge) || menge < 1) {
      fehlerDiv.textContent = "Bitte eine gültige Menge (mind. 1) eingeben.";
      return;
    }
    if (!erfasser) { fehlerDiv.textContent = "Bitte den Erfasser angeben."; return; }

    if (typ === "Entnahme" && bestand[med] < menge) {
      fehlerDiv.textContent =
        `Nicht genug Bestand. Aktueller Bestand: ${bestand[med]} Einheit(en).`;
      return;
    }

    const bestandVor = bestand[med];

    // Bestand anpassen
    if (typ === "Zugang") {
      bestand[med] += menge;
    } else {
      bestand[med] -= menge;
    }

    const bestandNach = bestand[med];

    // Zeile einfügen
    const tbody = document.getElementById("protokollBody");
    const leer = document.getElementById("leerZeile");
    if (leer) leer.remove();

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${datumHeute()}</td>
      <td class="med-name">${med}</td>
      <td class="zahl">${typ === "Zugang"   ? menge : ""}</td>
      <td class="zahl">${typ === "Entnahme" ? bestandVor : ""}</td>
      <td class="zahl">${typ === "Entnahme" ? menge : ""}</td>
      <td class="zahl">${typ === "Entnahme" ? bestandNach : bestandNach}</td>
      <td>${erfasser}</td>
    `;
    // Neueste oben
    tbody.insertBefore(tr, tbody.firstChild);

    // Formular zurücksetzen
    document.getElementById("fMedikament").value = "";
    document.getElementById("fMenge").value = "";
    document.getElementById("fErfasser").value = "";
  }
</script>

</body>
</html>
